/* Simple mobile design v2 */
:root{color-scheme:light;background:#f8f9fc;color:#272b3b}
body{background:linear-gradient(180deg,#fcfcff,#f4f5fa)}
main{max-width:480px;padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 20px);gap:13px}
header{padding:10px 4px 2px}h1{font-size:19px;letter-spacing:.02em}header small{display:block;margin-top:3px;font-size:11px}
button{background:#fff;border:1px solid #e5e5ee;color:#5c6072;font-weight:600;min-height:38px}
.panel{border-radius:20px;box-shadow:0 3px 14px #34345a0a;padding:14px}
.quick{background:#fff0f5;border:1px solid #f5d7e4;flex:0 0 39dvh;min-height:260px}
.saved{background:#eff0fc;border:1px solid #dbdef6;min-height:290px}
.heading{margin-bottom:12px}.avatar{width:40px;height:40px;background:#f8d5e4;color:#a84173;font-size:23px;font-weight:800}
.saved .avatar{background:#d9dcf7;color:#50569e}.name{font-size:15px}.quick .name{color:#84385f}.saved .name{color:#3c468c}
.sub{color:#8d7e91;font-size:11px}.saved .sub{color:#797da2}
textarea{background:white;border:1px solid #f0dce5;border-radius:13px;font-size:16px;line-height:1.7}
.quick .primary{background:#b64c80;border-color:#b64c80;color:white}.saved .primary{background:#5257a1;border-color:#5257a1;color:white}
.saved-list{max-height:35dvh;min-height:110px}.note{background:#fff;border:1px solid #e6e7f5;border-radius:13px;padding:12px}.note-title{color:#333b74}.note-body{color:#636779}
.note-actions button{font-size:11px;min-height:30px;padding:5px 7px}.add-row input{background:white;border:1px solid #d8dbf1}
.footer{padding:4px 3px;gap:12px}.status{font-size:11px}dialog{color:#2c2e3e}
/* Mobile-compatible editor overlay; avoids dialog.showModal and implicit form submission */
.editor-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:#18132499}
.editor-overlay[hidden]{display:none}
.editor-card{width:min(100%,440px);max-height:calc(100dvh - 40px);overflow:auto;background:white;border-radius:20px;padding:20px;box-shadow:0 15px 50px #0003}
.editor-card h2{margin:0 0 12px;font-size:18px}
.editor-card input,.editor-card textarea{display:block;width:100%;margin:8px 0 12px;border:1px solid #c7c3d3;border-radius:10px;padding:10px;font:inherit}
.editor-card textarea{height:min(38dvh,260px);min-height:140px;resize:vertical}
.editor-actions{display:flex;justify-content:flex-end;gap:8px}
.editor-actions .primary{background:#5257a1;color:white;border-color:#5257a1}
body.editor-open{overflow:hidden}
@media(max-height:740px){.quick{flex-basis:35dvh;min-height:220px}.saved{min-height:260px}}

.search-row{display:flex;gap:8px;margin:0 0 10px}.search-row input{width:100%;min-width:0;padding:11px 12px;border:1px solid #d8dbf1;border-radius:12px;background:white;font-size:16px}.search-row button{white-space:nowrap}.ad-slot{border:1px dashed #cbd0dc;border-radius:12px;min-height:54px;display:grid;place-items:center;color:#7b8192;background:#f5f6fa;font-size:12px;text-align:center;padding:8px}.ad-slot small{font-size:10px}.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#303449;color:white;padding:11px 16px;border-radius:100px;box-shadow:0 6px 24px #0003;z-index:200;font-size:13px;max-width:90vw;text-align:center}.toast[hidden]{display:none}.search-count{font-size:11px;color:#737899;margin:-3px 0 7px}.footer{flex-wrap:wrap}.saved-list{max-height:32dvh}

button:active{opacity:.75}input,textarea{touch-action:manipulation}

/* Ver.0.8: character-specific color and navigation */
:root{--char:#b64c80;--char-light:#ffe6f0}
.character-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:9px 0}
.character-tabs button{padding:11px 2px;border:2px solid transparent;border-radius:12px;background:#f1edf2;font-weight:700;font-size:13px;min-width:0;min-height:44px}
.character-tabs button[aria-selected="true"]{border-color:var(--char);background:var(--char-light);color:var(--char)}
.quick .avatar,.saved .avatar{background:var(--char-light);color:var(--char)}
.quick .name,.saved .name,.note-title{color:var(--char)}
.quick .primary,.saved .primary,.editor-actions .primary{background:var(--char);border-color:var(--char);color:#fff}

/* Ver.0.9 home and chibi cards */
.home-screen{padding:12px 2px 20px;display:flex;flex-direction:column;gap:18px}
.home-heading{text-align:center;padding:12px 0 4px}

.home-card{display:flex;flex-direction:column;overflow:hidden;padding:0;border:2px solid var(--card-color);border-radius:18px;background:#fff;box-shadow:0 4px 12px #40304818;min-width:0;text-align:center;min-height:0}
.home-card:focus-visible{outline:3px solid #6755af;outline-offset:3px}

.home-card-count{font-size:12px;color:#5e5266}
.home-tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.home-tools button{font-size:13px}
.memo-screen[hidden],.home-screen[hidden]{display:none!important}
.home-back{background:var(--char-light);color:var(--char);border-color:var(--char);margin:2px 0}
.memo-screen{display:flex;flex-direction:column;gap:12px;min-height:0}
.memo-screen .quick{flex-basis:35dvh}
@media(max-width:350px){.home-grid{gap:8px}.home-card-name{font-size:14px}.home-card-count{font-size:11px}}

.privacy-links{text-align:center;margin:0 0 12px}.privacy-links button{display:block;margin:8px auto;padding:12px 16px;border:1px solid #9774dc;border-radius:12px;background:white;color:#65428a;font-weight:700}.privacy-links button[hidden]{display:none}.privacy-links a{display:inline-block;padding:10px 14px;min-height:44px;color:#65428a;font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}.privacy-links a:focus-visible{outline:3px solid #9774dc;outline-offset:2px}
